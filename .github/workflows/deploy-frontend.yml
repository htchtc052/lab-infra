name: Deploy frontend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /srv/lab/infra
            git pull --ff-only
            docker compose pull cps-client
            docker compose up -d cps-client
            docker compose ps cps-client
            app_domain="$(sed -n 's/^APP_DOMAIN=//p' .env | head -n 1)"
            attempts=0
            until curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "https://${app_domain}/" > /dev/null; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 12 ]; then
                exit 1
              fi
              sleep 5
            done
