name: "lab"

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  postfix:
    image: boky/postfix
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN}
      HOSTNAME: mail.${MAIL_DOMAIN}
      DKIM_AUTOGENERATE: 1
    volumes:
      - postfix_dkim:/etc/opendkim/keys

  cps-app:
    build:
      context: ../backend
      dockerfile: .docker/prod/Dockerfile
    image: cps-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cps_photos:/var/www/storage/app

  cps-nginx:
    build:
      context: ../backend
      dockerfile: .docker/prod/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - cps-app
    volumes:
      - cps_photos:/var/www/storage/app:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cps-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.cps-api.entrypoints=websecure"
      - "traefik.http.routers.cps-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.cps-api.loadbalancer.server.port=8000"

  cps-queue:
    image: cps-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      - cps-app
    command: php artisan queue:work --queue=previews,viewers,cleanup --tries=3 --sleep=3
    volumes:
      - cps_photos:/var/www/storage/app

  cps-client:
    build:
      context: ../frontend
      dockerfile: .docker/prod/Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: https://${API_DOMAIN}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cps-app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.cps-app.entrypoints=websecure"
      - "traefik.http.routers.cps-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.cps-app.loadbalancer.server.port=3000"

volumes:
  postfix_dkim:
  pg_data:
  redis_data:
  traefik_acme:
  cps_photos:
